<title>世界色彩地球</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@500;600&display=swap">
<style>
/* Layout: soft UI, one screen that never scrolls. Tools sit in a sidebar on the left and colours in one on the right; both fold
   down to a narrow rail, and only their own columns scroll. The globe or country sheet fills the space between, with the readout
   and messages floating on it. Settings come in cards that fold away, and the reader chooses which cards and rows are shown.
   No hard borders: edges come from tinted, blurred shadows. The map keeps its own colours whatever the theme. */
:root {
  --bg: #f8fafc; --surface: #ffffff; --field: #f9fafb; --fg: #1f2937; --muted: #6b7280; --line: #e5e7eb;
  --accent: #5b5fc7; --on-accent: #ffffff; --accent-soft: rgb(91 95 199 / .1); --danger: #b4405a;
  --shadow-md: 0 4px 6px -1px rgb(148 163 184 / .18), 0 2px 4px -2px rgb(148 163 184 / .18);
  --shadow-lg: 0 10px 15px -3px rgb(148 163 184 / .22), 0 4px 6px -4px rgb(148 163 184 / .22);
  --shadow-xl: 0 20px 25px -5px rgb(148 163 184 / .22), 0 8px 10px -6px rgb(148 163 184 / .22);
  --shadow-hover: 0 20px 25px -5px rgb(91 95 199 / .2), 0 8px 10px -6px rgb(91 95 199 / .2);
  --shadow-accent: 0 10px 15px -3px rgb(91 95 199 / .3), 0 4px 6px -4px rgb(91 95 199 / .3);
  --press: inset 0 2px 6px rgb(100 116 139 / .18);
  --halo: 0 0 0 2px rgb(91 95 199 / .5), 0 0 0 7px rgb(91 95 199 / .12);
  --ease: cubic-bezier(.45, 0, .55, 1);
  --side: 300px; --rail: 56px;
  --ui: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151923; --surface: #1d2230; --field: #252b3b; --fg: #e5e7eb; --muted: #9ca3af; --line: #2f3646; --accent: #a5b4fc; --on-accent: #1e1b4b; --accent-soft: rgb(129 140 248 / .14); --danger: #f0a3b1; --shadow-md: 0 4px 6px -1px rgb(6 8 16 / .35), 0 2px 4px -2px rgb(6 8 16 / .35); --shadow-lg: 0 10px 15px -3px rgb(6 8 16 / .4), 0 4px 6px -4px rgb(6 8 16 / .4); --shadow-xl: 0 20px 25px -5px rgb(6 8 16 / .45), 0 8px 10px -6px rgb(6 8 16 / .45); --shadow-hover: 0 20px 25px -5px rgb(129 140 248 / .22), 0 8px 10px -6px rgb(129 140 248 / .22); --shadow-accent: 0 10px 15px -3px rgb(129 140 248 / .25), 0 4px 6px -4px rgb(129 140 248 / .25); --press: inset 0 2px 6px rgb(6 8 16 / .45); --halo: 0 0 0 2px rgb(165 180 252 / .55), 0 0 0 7px rgb(165 180 252 / .14); color-scheme: dark } }
:root[data-theme="dark"] { --bg: #151923; --surface: #1d2230; --field: #252b3b; --fg: #e5e7eb; --muted: #9ca3af; --line: #2f3646; --accent: #a5b4fc; --on-accent: #1e1b4b; --accent-soft: rgb(129 140 248 / .14); --danger: #f0a3b1; --shadow-md: 0 4px 6px -1px rgb(6 8 16 / .35), 0 2px 4px -2px rgb(6 8 16 / .35); --shadow-lg: 0 10px 15px -3px rgb(6 8 16 / .4), 0 4px 6px -4px rgb(6 8 16 / .4); --shadow-xl: 0 20px 25px -5px rgb(6 8 16 / .45), 0 8px 10px -6px rgb(6 8 16 / .45); --shadow-hover: 0 20px 25px -5px rgb(129 140 248 / .22), 0 8px 10px -6px rgb(129 140 248 / .22); --shadow-accent: 0 10px 15px -3px rgb(129 140 248 / .25), 0 4px 6px -4px rgb(129 140 248 / .25); --press: inset 0 2px 6px rgb(6 8 16 / .45); --halo: 0 0 0 2px rgb(165 180 252 / .55), 0 0 0 7px rgb(165 180 252 / .14); color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.6 var(--ui) }
/* the sidebar columns animate between full width and the rail */
@property --lw { syntax: "<length>"; inherits: true; initial-value: 300px }
@property --rw { syntax: "<length>"; inherits: true; initial-value: 300px }
.app { --lw: var(--side); --rw: var(--side); position: relative; height: 100vh; height: 100dvh; display: grid; gap: 16px 20px; grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top top top" "left stage right"; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: --lw .28s var(--ease), --rw .28s var(--ease) }
.app.left-shut { --lw: var(--rail) }
/* the saved layout is put in place without animating */
.app.still, .app.still * { transition: none !important }
.app.right-shut { --rw: var(--rail) }
.top { grid-area: top; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "brand bar tools"; align-items: center; gap: 12px 32px }
.top > .brand { grid-area: brand; white-space: nowrap }
.top > .toolbar { grid-area: bar }
.top > .row { grid-area: tools; justify-content: flex-end }
/* not enough room for one line: the toolbar moves under the title */
@media (max-width: 1320px) { .top { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand tools" "bar bar" } }
h1 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance }
.brand { display: flex; align-items: center; gap: 12px }
/* the mark sits on a round tinted badge */
.brand .mark { width: 44px; height: 44px; padding: 8px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--fg) }
.stage { grid-area: stage; display: grid; min-width: 0; min-height: 0 }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; min-height: 44px }
.toolbar .seg { width: 196px; flex: none }
.seg.three { grid-template-columns: repeat(3, 1fr) }
.toolbar .seg.three { width: 216px }
.toolbar .grow { flex: 1 1 200px; min-width: 0; position: relative }
.top .seg.lang { width: 124px }
.find-pop { position: absolute; z-index: 6; inset: calc(100% + 8px) 0 auto; margin: 0; padding: 6px; list-style: none; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-xl) }
.find-pop li { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 12px; border-radius: 12px; cursor: pointer; transition: background-color .2s var(--ease) }
.find-pop li[aria-selected="true"], .find-pop li:hover { background: var(--accent-soft) }
.find-pop .sub { margin-left: auto; color: var(--muted); font-size: 12px }
.flag { width: 20px; height: 15px; flex: none; border-radius: 3px; box-shadow: 0 0 0 1px rgb(31 41 55 / .12); object-fit: cover; vertical-align: -2px }
.blocs { display: grid; gap: 14px }
.bloc { display: grid; gap: 6px }
.bloc .check { justify-content: flex-start }
.bloc .years { color: var(--muted); font-size: 12px }
.bloc .n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap }
.bloc .sw { width: 18px; height: 18px; border-radius: 6px }
.bloc details > div { margin: 8px 0 0 26px; gap: 10px }
.bloc summary { margin-left: 26px; font-size: 12px; font-weight: 500; color: var(--muted) }
.member-flags { display: flex; flex-wrap: wrap; gap: 6px }
.member-flags button { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 32px; min-height: 32px; padding: 4px; border: 0; border-radius: 8px; background: none; color: var(--fg); font: inherit; font-size: 12px; cursor: pointer; transition: background-color .2s var(--ease), transform .2s var(--ease) }
.member-flags button:hover { background: var(--accent-soft); transform: translateY(-1px) }
.member-flags button:active { transform: scale(.95) }
.member-flags button.status { opacity: .6 }
.member-flags .chip-text { padding: 2px 8px; background: var(--field) }
.flat-name { flex: 1 1 120px; min-width: 0; margin: 0; font-size: 17px; font-weight: 600 }
.sheet { position: relative; margin: 0; width: 100%; height: 100%; min-height: 0; border-radius: 24px; background: var(--surface); box-shadow: var(--shadow-xl); overflow: hidden; transition: box-shadow .3s var(--ease) }
.sheet canvas, #flat { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
#hl { cursor: grab; touch-action: none; outline: none }
#hl.dragging { cursor: grabbing }
#hl.over { cursor: pointer }
.sheet:has(#hl:focus-visible) { box-shadow: var(--halo), var(--shadow-xl) }
#flat { cursor: grab; touch-action: none }
#flat.dragging { cursor: grabbing }
#flat [data-name] { cursor: inherit }
.zoombar { position: absolute; top: 14px; right: 14px; z-index: 2; display: grid; gap: 8px }
.zoombar button { width: 44px; height: 44px; padding: 0; border: 0; border-radius: 16px; background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: var(--shadow-lg); transition: transform .2s var(--ease), box-shadow .2s var(--ease) }
.zoombar button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-hover) }
.zoombar button:active:not(:disabled) { transform: scale(.95); box-shadow: var(--press) }
/* disabled stays opaque, so it does not turn muddy over the map */
.zoombar button:disabled { color: var(--muted); box-shadow: var(--shadow-md); cursor: default }
#flat .nohit { pointer-events: none }
/* what floats on the map: the readout and the frame meter at the bottom left, loading notes and messages at the top */
.hud { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 8px; pointer-events: none }
.hud.bottom { left: 14px; bottom: 14px; align-items: flex-start; max-width: min(720px, calc(100% - 28px)) }
.hud.top { top: 14px; left: 50%; translate: -50% 0; align-items: center; width: max-content; max-width: calc(100% - 160px) }
.pill { margin: 0; padding: 6px 12px; border-radius: 12px; background: var(--surface); color: var(--fg); font-size: 12px; line-height: 1.5; box-shadow: var(--shadow-md); opacity: .95 }
.pill:empty { display: none }
#readout .flag { margin-right: 2px }
#load-note { color: var(--muted) }
#msg { max-width: 560px; text-align: center; opacity: 0; translate: 0 -6px; visibility: hidden; transition: opacity .25s var(--ease), translate .25s var(--ease), visibility 0s .25s }
#msg.show { opacity: .97; translate: 0 0; visibility: visible; transition: opacity .25s var(--ease), translate .25s var(--ease) }
/* the desktop app on macOS hides the system title bar; this strip carries the window controls, the file name and the drag area */
.titlebar { position: fixed; inset: 0 0 auto; height: 40px; z-index: 10; display: flex; align-items: center; justify-content: center; padding-inline: 88px; background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-app-region: drag; user-select: none }
:root.titlebar-inset .app { padding-top: 48px }
.fps { color: var(--muted); font-family: var(--mono); font-variant-numeric: tabular-nums }

/* ---- sidebars ---- */
.side { grid-area: left; position: relative; z-index: 3; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 12px; min-width: 0; min-height: 0 }
.side.right { grid-area: right }
.side-head { display: flex; align-items: center; gap: 8px; min-width: 0 }
.side.right .side-head { flex-direction: row-reverse }
.side-title { flex: 1; min-width: 0; margin: 0; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.side.right .side-title { text-align: right }
/* the column scrolls on its own; the cards keep room for their shadows. It keeps its width while the column folds, sliding out
   past the window edge instead of squeezing its contents. */
.side-body { width: calc(var(--side) + 24px); min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px; margin: -4px -12px 0; padding: 4px 12px 24px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; transition: opacity .2s var(--ease), visibility 0s }
.side.left .side-body { justify-self: end }
.side.right .side-body { justify-self: start }
.side.shut .side-body { opacity: 0; visibility: hidden; transition: opacity .15s var(--ease), visibility 0s .28s }
.side.shut .side-head { flex-direction: column }
.side.shut .side-title { flex: none; writing-mode: vertical-rl; padding-block: 4px; cursor: pointer; overflow: visible }
.side.shut .edit-toggle { display: none }
.icon-btn { width: 44px; height: 44px; flex: none; display: grid; place-items: center; padding: 0; border: 0; border-radius: 16px; background: var(--surface); color: var(--fg); cursor: pointer; box-shadow: var(--shadow-lg); transition: transform .2s var(--ease), box-shadow .2s var(--ease), background-color .2s var(--ease), color .2s var(--ease) }
.icon-btn svg { width: 20px; height: 20px }
.icon-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover) }
.icon-btn:active { transform: scale(.95); box-shadow: var(--press) }
.icon-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-accent) }
.side-toggle svg { transition: rotate .28s var(--ease) }
.side.right .side-toggle svg, .side.left.shut .side-toggle svg { rotate: 180deg }
.side.right.shut .side-toggle svg { rotate: 0deg }
/* a card per group of settings; its title folds it away */
.sec { flex: none; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow-lg) }
.sec-head { display: flex; align-items: center; gap: 2px; padding: 4px 6px }
.sec-h { flex: 1; min-width: 0; margin: 0; font-size: 15px; font-weight: 600 }
.sec-toggle { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 10px 0 14px; border: 0; border-radius: 14px; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; transition: background-color .2s var(--ease) }
.sec-toggle:hover { background: var(--accent-soft) }
.sec-toggle span { flex: 1; min-width: 0 }
.sec-toggle svg { width: 18px; height: 18px; flex: none; color: var(--muted); transition: rotate .25s var(--ease) }
.sec.closed .sec-toggle svg { rotate: -90deg }
.sec-body { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .25s var(--ease) }
.sec.closed .sec-body { grid-template-rows: 0fr }
.sec-inner { min-height: 0; overflow: hidden }
.sec-pad { display: grid; gap: 16px; padding: 4px 20px 20px }
.sec-tools { display: none; flex: none; gap: 2px }
.tool { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 10px; background: none; color: var(--muted); cursor: pointer; transition: background-color .2s var(--ease), color .2s var(--ease) }
.tool svg { width: 18px; height: 18px }
.tool:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent) }
.tool:disabled { opacity: .35; cursor: default }
.tool[aria-pressed="false"] { color: var(--danger) }
/* editing what shows: every card and every marked row gets an eye; what is switched off disappears once editing ends */
.edit-bar { display: none; flex: none; gap: 10px; padding: 16px 18px; border-radius: 20px; background: var(--accent-soft) }
.edit-bar .row { justify-content: flex-start }
.item { position: relative; min-width: 0 }
.item > .eye { display: none; position: absolute; top: -2px; right: -6px }
.app.editing .edit-bar { display: grid }
.app.editing .sec-tools { display: flex }
.app.editing .item { padding-right: 32px }
.app.editing .item > .eye { display: grid }
.app.editing .item::before { content: ""; position: absolute; inset: -4px -8px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); pointer-events: none }
.app:not(.editing) .is-off { display: none !important }
.app.editing .sec.is-off { opacity: .55; box-shadow: inset 0 0 0 1.5px var(--line) }
.app.editing .item.is-off > :not(.eye) { opacity: .4 }
/* the elevation legend: one bar for the land, one for the sea, each band's lower edge under it */
.legend { display: grid; gap: 10px; margin: 8px 0 2px 26px }
.legend-row { display: grid; gap: 4px }
.legend-name { color: var(--muted); font-size: 12px }
.legend-bar, .legend-ticks { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr) }
.legend-bar { height: 12px; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1px rgb(31 41 55 / .08) }
.legend-ticks { color: var(--muted); font-size: 10px; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap }
.legend-ticks span { min-width: 0 }
/* brushes: one row per colour */
.brushes { display: grid; gap: 8px }
.chip { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 14px 6px 8px; border: 0; border-radius: 16px; background: var(--field); color: var(--fg); font: inherit; text-align: left; cursor: pointer; transition: transform .2s var(--ease), box-shadow .2s var(--ease), background-color .2s var(--ease) }
.chip:hover { background: var(--surface); box-shadow: var(--shadow-hover) }
.chip:active { transform: scale(.98); box-shadow: var(--press) }
.chip[aria-pressed="true"] { background: var(--surface); box-shadow: 0 0 0 2px var(--accent), var(--shadow-hover); font-weight: 500 }
.chip > span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap }
.chip.add { justify-content: center; padding-left: 14px; background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--line) }
.chip.add:hover { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1.5px transparent }
.sw { width: 24px; height: 24px; flex: none; border: 1px solid rgb(31 41 55 / .14); border-radius: 8px }
.field { display: grid; gap: 6px; min-width: 0 }
.field > label, .field > .lab { color: var(--muted); font-size: 12px }
input[type="text"], input[type="search"], textarea { width: 100%; min-width: 0; min-height: 44px; padding: 10px 14px; border: 0; border-radius: 16px; background: var(--field); color: var(--fg); font: inherit; transition: background-color .2s var(--ease), box-shadow .2s var(--ease) }
input[type="text"]:focus, input[type="search"]:focus, textarea:focus { outline: none; background: var(--surface); box-shadow: var(--halo) }
::placeholder { color: var(--muted); opacity: 1 }
/* on the bare workspace the search box is a white field of its own */
.top input[type="search"] { background: var(--surface); box-shadow: var(--shadow-lg) }
.top input[type="search"]:focus { box-shadow: var(--halo), var(--shadow-lg) }
.mono { font-family: var(--mono) !important; font-size: 13px !important }
textarea { resize: vertical }
.color { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center }
input[type="color"] { width: 44px; height: 44px; padding: 6px; border: 0; border-radius: 16px; background: var(--field); cursor: pointer }
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0 }
input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 10px }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-lg) }
.side .seg { background: var(--field); box-shadow: none }
.seg label { display: flex; align-items: center; justify-content: center; min-height: 36px; padding: 4px 8px; border-radius: 12px; text-align: center; cursor: pointer; transition: background-color .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease) }
.seg label:hover { background: var(--accent-soft) }
.seg label:active { box-shadow: var(--press) }
.seg input { position: absolute; opacity: 0; pointer-events: none }
.seg input:checked + span { font-weight: 600 }
.seg label:has(input:checked) { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-accent) }
.seg label:has(input:focus-visible) { box-shadow: var(--halo) }
.check { display: flex; align-items: center; gap: 10px; min-height: 28px; cursor: pointer }
.check input { width: 16px; height: 16px; flex: none; accent-color: var(--accent) }
.range { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 10px; align-items: center }
.range input { width: 100%; accent-color: var(--accent) }
.range output { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right }
.btn { min-height: 44px; padding: 8px 18px; border: 0; border-radius: 16px; background: var(--surface); color: var(--fg); font: inherit; font-weight: 500; cursor: pointer; box-shadow: var(--shadow-lg); transition: transform .2s var(--ease), box-shadow .2s var(--ease), background-color .2s var(--ease) }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow-hover) }
.btn:active:not(:disabled) { transform: scale(.97); box-shadow: var(--press) }
.btn:disabled { opacity: .5; cursor: default }
.side .btn { background: var(--field); box-shadow: none }
.side .btn:hover:not(:disabled) { background: var(--surface); box-shadow: var(--shadow-hover) }
.btn.primary, .side .btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: var(--shadow-accent) }
.btn.primary:hover:not(:disabled) { background: var(--accent); box-shadow: var(--shadow-hover), var(--shadow-accent) }
.btn.quiet { color: var(--danger); justify-self: start }
.row { display: flex; flex-wrap: wrap; gap: 10px }
.err { margin: 0; color: var(--danger); font-size: 12px }
.note { margin: 0; color: var(--muted); font-size: 12px }
summary { cursor: pointer; font-size: 13px; font-weight: 600; border-radius: 8px }
details > div { display: grid; gap: 10px; margin-top: 14px }
:focus-visible { outline: 2px solid rgb(91 95 199 / .55); outline-offset: 3px }
.btn:focus-visible, .chip:focus-visible, .zoombar button:focus-visible, .icon-btn:focus-visible, .sec-toggle:focus-visible, .tool:focus-visible { outline: none; box-shadow: var(--halo) }
/* touch screens: every target at least 44px */
@media (pointer: coarse) {
  .member-flags button { min-width: 44px; min-height: 44px }
  .check { min-height: 44px }
  .tool { width: 44px; height: 44px }
  summary { padding-block: 13px }
}

// a row's name for its eye button: its own label, or the first translated text in it
const itemName = item => item.dataset.name || (item.dataset.nameKey ? t(item.dataset.nameKey) : (item.querySelector('[data-i18n]') || item).textContent.trim());
function decorateItems() {
  for (const item of document.querySelectorAll('.side [data-item]')) {
    const key = 'i:' + item.dataset.item, off = listed('hidden', key);
    let eye = item.querySelector(':scope > .eye');
    if (!eye) { eye = iconTool('eye', '', () => { flip('hidden', key); item.querySelector(':scope > .eye').focus(); }); item.append(eye); }
    item.classList.toggle('is-off', off);
    eye.innerHTML = off ? ICON.eyeOff : ICON.eye;
    eye.setAttribute('aria-pressed', String(!off));
    eye.setAttribute('aria-label', t(off ? 'showItem' : 'hideItem', { name: itemName(item) }));
    eye.title = eye.getAttribute('aria-label');
  }
}
function applyLayout() {
  const app = $('app');
  for (const s of SIDES) {
    const open = isOpen(s), body = $(s + '-body'), toggle = $(s + '-toggle');
    app.classList.toggle(s + '-shut', !open);
    $('side-' + s).classList.toggle('shut', !open);
    body.inert = !open;
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', t(open ? 'sideCollapse' : 'sideExpand', { name: t(s + 'Title') }));
    toggle.title = `${toggle.getAttribute('aria-label')} (${s === 'left' ? '[' : ']'})`;
    for (const id of layout.order[s]) body.append(secs[id]);
  }
  for (const s of SIDES) layout.order[s].forEach((id, i, list) => {
    const sec = secs[id], closed = listed('closed', id), off = listed('hidden', 's:' + id), name = t(sec.dataset.title);
    sec.classList.toggle('closed', closed);
    sec.classList.toggle('is-off', off);
    sec.querySelector('.sec-toggle').setAttribute('aria-expanded', String(!closed));
    sec.querySelector('.sec-body').inert = closed;
    const tool = (k, label, disabled) => { const b = sec.querySelector('.sec-tools .' + k); b.setAttribute('aria-label', label); b.title = label; b.disabled = !!disabled; return b; };
    tool('up', t('moveUp', { name }), i === 0);
    tool('down', t('moveDown', { name }), i === list.length - 1);
    tool('swap', t(s === 'left' ? 'moveRight' : 'moveLeft', { name }));
    const eye = tool('eye', t(off ? 'showItem' : 'hideItem', { name }));
    eye.innerHTML = off ? ICON.eyeOff : ICON.eye;
    eye.setAttribute('aria-pressed', String(!off));
  });
  decorateItems();
  app.classList.toggle('editing', editing);
  for (const b of document.querySelectorAll('.edit-toggle')) {
    b.setAttribute('aria-pressed', String(editing));
    b.setAttribute('aria-label', t(editing ? 'editDone' : 'editLayout'));
    b.title = b.getAttribute('aria-label');
  }
}
buildSections();
layout = readLayout();
narrow.addEventListener('change', () => { narrowOpen.left = narrowOpen.right = false; applyLayout(); });
// [ and ] fold the sidebars, Escape leaves editing; never while typing
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (e.metaKey || e.ctrlKey || e.altKey || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable) return;
  if (e.code === 'BracketLeft' || e.code === 'BracketRight') { e.preventDefault(); toggleSide(e.code === 'BracketLeft' ? 'left' : 'right'); }
  else if (e.key === 'Escape' && editing) setEditing(false);
});
// the configuration note says where changes are kept
$('cfg-note').dataset.i18n = platform.kind === 'desktop' ? 'cfgNoteDesktop' : 'cfgNote';

/* ---- interface theme ---- */
// "system" leaves the choice to the browser, the Artifact viewer or macOS; light and dark pin it. The map keeps its own colours.
const hostTheme = document.documentElement.getAttribute('data-theme');
function setTheme(t) {
  const root = document.documentElement, pinned = t === 'light' || t === 'dark';
  if (pinned) root.setAttribute('data-theme', t);
  else if (hostTheme) root.setAttribute('data-theme', hostTheme);
  else root.removeAttribute('data-theme');
  for (const k of ['system', 'light', 'dark']) $('theme-' + k).checked = k === (pinned ? t : 'system');
}
for (const k of ['system', 'light', 'dark']) $('theme-' + k).addEventListener('change', e => { setTheme(e.target.value); platform.pref('theme', e.target.value); });
setTheme(platform.pref('theme') || 'system');
if (platform.titleBar) {
  document.documentElement.classList.add('titlebar-inset');
  $('titlebar').hidden = false;
}
platform.on('title', t => { $('titlebar').textContent = (t.dirty ? '● ' : '') + t.name; });

/* ---- language ---- */
function setLang(next) {
  lang = next === 'en' ? 'en' : 'zh';
  $('lang-zh').checked = lang === 'zh';
  $('lang-en').checked = lang === 'en';
  translatePage();
  applyLayout();
  renderAll();
  showHint();
  if (meterTimer) showMeter();
  if (view === 'flat') renderFlat();
}
for (const k of ['zh', 'en']) $('lang-' + k).addEventListener('change', e => { setLang(e.target.value); platform.pref('lang', lang); });

/* ---- desktop menu ---- */
// a project opened from disk, or a new one, replaces the colours and starts a fresh undo history
platform.on('project', raw => {
  cfg = normalize(raw || { cats: [] });
  active = cfg.cats[0] ? cfg.cats[0].id : BASE;
  undoStack.length = 0;
  lastSaved = JSON.stringify(cfg);
  $('undo').disabled = true;
  platform.config.baseline(cfg);
  if (view === 'flat') closeCountry();
  if (cfg.admin) ensureAdmin();
  renderAll();
});
platform.on('undo', () => {
  const t = document.activeElement;
  if (t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && /text|search/.test(t.type)))) document.execCommand('undo');
  else $('undo').click();
});
platform.on('png', () => save(fileBase() + '.png', currentPng));
platform.on('svg', () => save(fileBase() + '.svg', currentSvg));

resize();
startGL();
setLang(lang);
renderAll();
showHint();
syncZoom();
if (cfg.admin) ensureAdmin();
if (platform.pref('fps')) setMeter(true);
requestAnimationFrame(() => requestAnimationFrame(() => $('app').classList.remove('still')));
</script>
